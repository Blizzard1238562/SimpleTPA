name: SimpleTPA
version: '${project.version}'
main: Blizzard1238562.simpleTPA.SimpleTPA
api-version: '1.21'
folia-supported: true
softdepend: [PlaceholderAPI]
commands:
  tpa:
    description: Sends a TPA-Request to a Player.
    usage: /tpa <player|version|help>
  tpahere:
    description: Asks a Player to teleport to you.
    usage: /tpahere <player>
  tpaccept:
    description: Accepts a TPA-Request by a Player.
    usage: /tpaccept [player]
  tpdeny:
    description: Denies a TPA-Request by a Player.
    usage: /tpdeny [player]
  tpreload:
    description: Reloads  config.yml
    usage: /tpreload
  tpacancel:
    description: Cancels your pending TPA-Request.
    usage: /tpacancel [player]
  tpatoggle:
    description: Toggles whether you accept incoming TPA-Requests.
    usage: /tpatoggle
  tpdebug:
    description: Toggles console logging of TPA request lifecycle events.
    usage: /tpdebug
  tphere:
    description: Force-teleports a Player to you.
    usage: /tphere <player>
  tpo:
    description: Teleports you to an offline Player's last known location.
    usage: /tpo <player>

permissions:
  tpa.command.tpa:
    description: Allows sending TPA requests.
    default: true
  tpa.command.tpahere:
    description: Allows sending TPA-Here requests.
    default: true
  tpa.command.tpaccept:
    description: Allows accepting incoming TPA requests.
    default: true
  tpa.command.tpdeny:
    description: Allows denying incoming TPA requests.
    default: true
  tpa.command.tpacancel:
    description: Allows canceling your pending TPA request.
    default: true
  tpa.command.tpatoggle:
    description: Allows toggling whether you can receive TPA requests.
    default: true
  tpa.command.version:
    description: Allows viewing plugin version info via /tpa version.
    default: true
  tpa.command.help:
    description: Allows viewing the command list via /tpa help.
    default: true
  tpa.reload:
    description: Allows reloading the SimpleTPA configuration.
    default: op
  tpa.debug:
    description: Allows toggling TPA event debug logging.
    default: op
  tpa.command.tphere:
    description: Allows force-teleporting a Player to you.
    default: op
  tpa.command.tpo:
    description: Allows teleporting to an offline Player's last known location.
    default: op