help_messages:
  header: "§6--- SimpleTPA Commands ---"
  tpa: "§e/tpa §7[player] - Sends a TPA-Request to a Player."
  tpahere: "§e/tpahere §7[player] - Asks a Player to teleport to you."
  tpaccept: "§a/tpaccept §7[player] - Accepts a pending TPA-Request. Specify a Player if you have multiple."
  tpdeny: "§c/tpdeny §7[player] - Denies a pending TPA-Request. Specify a Player if you have multiple."
  tpacancel: "§e/tpacancel §7[player] - Cancels one of your pending outgoing TPA-Requests."
  tpatoggle: "§e/tpatoggle §7- Toggles whether you can receive TPA-Requests."
  version: "§e/tpa version §7- Shows the current plugin version and update status."
  help: "§e/tpa help §7- Shows this help message."
  tpreload: "§e/tpreload §7- Reloads the plugin configuration."
